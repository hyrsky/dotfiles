---
# Deploy shell aliases and make sure the interactive shell picks them up.

- name: Install zsh aliases
  ansible.builtin.copy:
    src: zsh_aliases
    dest: "{{ ansible_env.HOME }}/.zsh_aliases"
    mode: "0644"

- name: Source the aliases from .zshrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED: zsh aliases"
    block: |
      [ -f ~/.zsh_aliases ] && source ~/.zsh_aliases
