---
# Deploy a modern, plugin-free vim baseline.

- name: Create vim state directories (undo, swap, backup)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.vim/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - undo
    - swap
    - backup

- name: Install vimrc
  ansible.builtin.copy:
    src: vimrc
    dest: "{{ ansible_env.HOME }}/.vimrc"
    mode: "0644"
