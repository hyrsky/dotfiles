---
# Deploy a modern, plugin-free vim baseline. The vimrc creates its own state
# directories on first launch (under $XDG_CACHE_HOME on Linux, ~/.vim
# elsewhere), so there's nothing to pre-create here.

- name: Install vimrc
  ansible.builtin.copy:
    src: vimrc
    dest: "{{ ansible_env.HOME }}/.vimrc"
    mode: "0644"
