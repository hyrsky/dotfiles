---
# Variables shared across all hosts. Override per-OS in the relevant role
# or here as needed.

# Packages installed on every system, via each OS's native package manager
common_packages:
  - zsh
  - vim
  - git  # used to clone Oh My Zsh and manage dotfiles

# --- macOS: Touch ID for sudo ---
# Enable authenticating `sudo` in the terminal with Touch ID.
macos_enable_touchid_sudo: true

# --- Linux: Proton Pass ---
# Install Proton Pass from Flathub, start it on login, and use its SSH agent
# for ssh and git commit signing.
linux_proton_pass: true
